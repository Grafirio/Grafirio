version: '3.8'

services:
  sqlserver-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: grafirio-sqlserver-test
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Test123!@#
      - MSSQL_PID=Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-test-data:/var/opt/mssql
    networks:
      - grafirio-test-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Test123!@# -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  sqlserver-test-data:
    driver: local

networks:
  grafirio-test-network:
    driver: bridge
