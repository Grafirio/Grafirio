# Independent synthetic test infrastructure. Not an override for docker-compose.yml.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: grafirio_test
      POSTGRES_PASSWORD: ${GRAFIRIO_TEST_PASSWORD:?Run New-WorktreeEnvironment.ps1 first}
      POSTGRES_DB: ${GRAFIRIO_TEST_DATABASE:?Missing test database}
    ports:
      - "127.0.0.1:${GRAFIRIO_TEST_POSTGRES_PORT:?Missing port}:5432"
    volumes:
      - postgres-test:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${GRAFIRIO_TEST_REDIS_PORT:?Missing port}:6379"
    volumes:
      - redis-test:/data
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${GRAFIRIO_TEST_PASSWORD:?Missing password}
    ports:
      - "127.0.0.1:${GRAFIRIO_TEST_SQL_PORT:?Missing port}:1433"
    volumes:
      - sql-test:/var/opt/mssql
volumes:
  postgres-test:
  redis-test:
  sql-test:
