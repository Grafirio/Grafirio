name: Azure Container Apps CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/azure-containerapps-cicd.yml
      - src/**
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: all
        type: choice
        options:
          - changed
          - all
          - django-ai
          - schema-analyzer
          - pycaret-engine
          - identity-api
          - commerce-api
          - data-analysis-api
          - gateway
          - frontend
          - projectadmin
          - useradmin

concurrency:
  group: azure-containerapps-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  # Grafirio.Shared.* paketleri GitHub Packages'ta; bu izinle Actions'in
  # otomatik GITHUB_TOKEN'i onlari okuyabilir ve ayrica PAT gerekmez.
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RESOURCE_GROUP: grifirio-rg
  ACR_NAME: grifirioacr
  ACR_LOGIN_SERVER: grifirioacr.azurecr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      has_changes: ${{ steps.generate-matrix.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            django-ai:
              - 'src/ai/grafirio-ai-service/**'
            schema-analyzer:
              - 'src/ai/ai-service-schema-analyzer/**'
            pycaret-engine:
              - 'src/ai/ai-service-pycaret-engine/**'
            identity-api:
              - 'src/services/Grafirio.Identity.Api/**'
            commerce-api:
              - 'src/services/Grafirio.Commerce.Api/**'
            data-analysis-api:
              - 'src/services/Grafirio.DataAnalysis.Api/**'
            gateway:
              - 'src/services/Grafirio.Gateway/**'
            frontend:
              - 'src/front/grifirio.front/**'
            projectadmin:
              - 'src/front/admins/grifirio.projectadmin/**'
            useradmin:
              - 'src/front/admins/grifirio.useradmin/**'

      - name: Build deployment matrix
        id: generate-matrix
        env:
          FILTER_DJANGO_AI: ${{ steps.filter.outputs.django-ai }}
          FILTER_SCHEMA_ANALYZER: ${{ steps.filter.outputs.schema-analyzer }}
          FILTER_PYCARET_ENGINE: ${{ steps.filter.outputs.pycaret-engine }}
          FILTER_IDENTITY_API: ${{ steps.filter.outputs.identity-api }}
          FILTER_COMMERCE_API: ${{ steps.filter.outputs.commerce-api }}
          FILTER_DATA_ANALYSIS_API: ${{ steps.filter.outputs.data-analysis-api }}
          FILTER_GATEWAY: ${{ steps.filter.outputs.gateway }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FILTER_PROJECTADMIN: ${{ steps.filter.outputs.projectadmin }}
          FILTER_USERADMIN: ${{ steps.filter.outputs.useradmin }}
          TARGET_INPUT: ${{ github.event.inputs.target || '' }}
        run: |
          set -euo pipefail

          SERVICES='[
            {"key":"django-ai","image":"django-ai","dockerfile":"./src/ai/grafirio-ai-service/Dockerfile","context":"./src/ai/grafirio-ai-service","app":"django-ai","port":8000,"ingress":"internal"},
            {"key":"schema-analyzer","image":"schema-analyzer","dockerfile":"./src/ai/ai-service-schema-analyzer/Dockerfile","context":"./src/ai/ai-service-schema-analyzer","app":"schema-analyzer","port":8001,"ingress":"internal"},
            {"key":"pycaret-engine","image":"pycaret-engine","dockerfile":"./src/ai/ai-service-pycaret-engine/Dockerfile","context":"./src/ai/ai-service-pycaret-engine","app":"pycaret-engine","port":8002,"ingress":"internal"},
            {"key":"identity-api","image":"identity-api","dockerfile":"./src/services/Grafirio.Identity.Api/Grafirio.Identity.Api/Dockerfile","context":".","app":"identity-api","port":8080,"ingress":"internal"},
            {"key":"commerce-api","image":"commerce-api","dockerfile":"./src/services/Grafirio.Commerce.Api/Dockerfile","context":".","app":"commerce-api","port":8080,"ingress":"internal"},
            {"key":"data-analysis-api","image":"data-analysis-api","dockerfile":"./src/services/Grafirio.DataAnalysis.Api/Dockerfile","context":".","app":"data-analysis-api","port":8080,"ingress":"internal"},
            {"key":"gateway","image":"gateway","dockerfile":"./src/services/Grafirio.Gateway/Dockerfile","context":".","app":"gateway","port":8080,"ingress":"external"},
            {"key":"frontend","image":"frontend","dockerfile":"./src/front/grifirio.front/Dockerfile","context":"./src/front/grifirio.front","app":"frontend","port":80,"ingress":"external"},
            {"key":"projectadmin","image":"projectadmin","dockerfile":"./src/front/admins/grifirio.projectadmin/Dockerfile","context":"./src/front/admins/grifirio.projectadmin","app":"projectadmin","port":80,"ingress":"external"},
            {"key":"useradmin","image":"useradmin","dockerfile":"./src/front/admins/grifirio.useradmin/Dockerfile","context":"./src/front/admins/grifirio.useradmin","app":"useradmin","port":80,"ingress":"external"}
          ]'

          include_all=false
          selected_service=""
          target="${TARGET_INPUT:-changed}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$target" = "all" ]; then
              include_all=true
            elif [ "$target" != "changed" ] && [ -n "$target" ]; then
              selected_service="$target"
            fi
          fi

          changed_keys=""
          for key in django-ai schema-analyzer pycaret-engine identity-api commerce-api data-analysis-api gateway frontend projectadmin useradmin; do
            env_key="FILTER_$(echo "$key" | tr '[:lower:]-' '[:upper:]_')"
            value="${!env_key:-false}"
            if [ "$value" = "true" ]; then
              changed_keys="$changed_keys $key"
            fi
          done

          if [ "$include_all" = true ]; then
            matrix="$SERVICES"
          elif [ -n "$selected_service" ]; then
            matrix=$(echo "$SERVICES" | jq -c --arg key "$selected_service" '[.[] | select(.key == $key)]')
          else
            if [ -n "$changed_keys" ]; then
              keys_json=$(printf '%s\n' $changed_keys | jq -R . | jq -sc .)
              matrix=$(echo "$SERVICES" | jq -c --argjson keys "$keys_json" '[.[] | select(.key as $k | ($keys | index($k)) != null)]')
            else
              matrix='[]'
            fi
          fi

          count=$(echo "$matrix" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Print selected services
        run: |
          echo "Has changes: ${{ steps.generate-matrix.outputs.has_changes }}"
          echo "Matrix: ${{ steps.generate-matrix.outputs.matrix }}"

  build-push-deploy:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name "$ACR_NAME"

      - name: Build, Push, and Deploy Service
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          full_image="$ACR_LOGIN_SERVER/${{ matrix.service.image }}:$TAG"

          echo "Building $full_image"
          # Varsayilan olarak Actions'in kendi GITHUB_TOKEN'i kullanilir; paketler
          # baska bir org/hesapta durdugu icin yetmezse GITHUB_PACKAGES_TOKEN
          # secret'i tanimlanip devreye alinabilir.
          docker build -t "$full_image" \
            --build-arg GITHUB_PACKAGES_USER="${{ secrets.GITHUB_PACKAGES_USER || github.actor }}" \
            --build-arg GITHUB_PACKAGES_TOKEN="${{ secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" \
            -f "${{ matrix.service.dockerfile }}" "${{ matrix.service.context }}"

          echo "Pushing $full_image"
          docker push "$full_image"

          echo "Deploying container app ${{ matrix.service.app }}"
          if az containerapp show --name "${{ matrix.service.app }}" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
            az containerapp update \
              --name "${{ matrix.service.app }}" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$full_image"
          else
            echo "App not found, creating ${{ matrix.service.app }}"
            ENV_ID=$(az containerapp show --name identity-api --resource-group "$RESOURCE_GROUP" --query "properties.environmentId" -o tsv)
            az containerapp create \
              --name "${{ matrix.service.app }}" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ENV_ID" \
              --image "$full_image" \
              --registry-server "$ACR_LOGIN_SERVER" \
              --target-port "${{ matrix.service.port }}" \
              --ingress "${{ matrix.service.ingress }}"
          fi

      - name: Show updated service status
        run: |
          az containerapp show \
            --name "${{ matrix.service.app }}" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name,state:properties.runningStatus,latestRevision:properties.latestRevisionName}" \
            -o table

  no-op:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes != 'true'
    steps:
      - name: No service changes detected
        run: echo "No service-level changes detected. Skipping deployment."
