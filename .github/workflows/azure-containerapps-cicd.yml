name: Azure Container Apps CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/azure-containerapps-cicd.yml
      - src/**
      - keycloak/**
      - docker-keycloak-themes/**
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: all
        type: choice
        options:
          - changed
          - all
          - pycaret-engine
          - identity-api
          - commerce-api
          - data-analysis-api
          - gateway
          - frontend
          - projectadmin
          - useradmin
          - keycloak
          - bridge-desktop

concurrency:
  group: azure-containerapps-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  # Grafirio.Shared.* paketleri GitHub Packages'ta; bu izinle Actions'in
  # otomatik GITHUB_TOKEN'i onlari okuyabilir ve ayrica PAT gerekmez.
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RESOURCE_GROUP: grifirio-rg
  ACR_NAME: grifirioacr
  ACR_LOGIN_SERVER: grifirioacr.azurecr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      has_changes: ${{ steps.generate-matrix.outputs.has_changes }}
      bridge_desktop_changed: ${{ steps.generate-matrix.outputs.bridge_desktop_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            pycaret-engine:
              - 'src/ai/ai-service-pycaret-engine/**'
            # Paylasilan kutuphanelerin surumu shared-packages.ref'te sabit ve
            # asagidaki dort servisin hepsi ondan derleniyor. Dosya degisince
            # HEPSI birlikte yeniden derlenmeli: yarisi yeni yarisi eski
            # kutuphaneyle kalirsa ayni sistemde iki farkli sozlesme olusur ve
            # bu, sessizce yanlis calisan bir sistem demek. 2026-08-20'de tam
            # olarak bu yasandi. Ayrintisi: shared-packages.md
            identity-api:
              - 'src/services/Grafirio.Identity.Api/**'
              - 'shared-packages.ref'
            commerce-api:
              - 'src/services/Grafirio.Commerce.Api/**'
              - 'shared-packages.ref'
            data-analysis-api:
              - 'src/services/Grafirio.DataAnalysis.Api/**'
              - 'shared-packages.ref'
            gateway:
              - 'src/services/Grafirio.Gateway/**'
              - 'shared-packages.ref'
            # Paylasilan tema bu iki uygulamanin icine derleniyor; degisince
            # ikisi de yeniden yayinlanmali, yoksa renk canliya cikmaz.
            frontend:
              - 'src/front/grifirio.front/**'
              - 'src/front/shared/**'
            projectadmin:
              - 'src/front/admins/grifirio.projectadmin/**'
            useradmin:
              - 'src/front/admins/grifirio.useradmin/**'
              - 'src/front/shared/**'
            # Keycloak stok imaj + kendi temamiz. Tema ya da realm degisince
            # imajin yeniden derlenmesi gerekiyor, yoksa musteri hala
            # Keycloak'in varsayilan ekranini gorur.
            keycloak:
              - 'docker-keycloak-themes/**'
              - 'keycloak/**'
            # Masaustu kabugu ayri bir is: Windows runner'a ve az storage'a
            # ihtiyaci var, container servisleriyle ayni matriste calismiyor.
            bridge-desktop:
              - 'src/bridge/**'
              - '.github/workflows/azure-containerapps-cicd.yml'

      - name: Build deployment matrix
        id: generate-matrix
        env:
          FILTER_PYCARET_ENGINE: ${{ steps.filter.outputs.pycaret-engine }}
          FILTER_IDENTITY_API: ${{ steps.filter.outputs.identity-api }}
          FILTER_COMMERCE_API: ${{ steps.filter.outputs.commerce-api }}
          FILTER_DATA_ANALYSIS_API: ${{ steps.filter.outputs.data-analysis-api }}
          FILTER_GATEWAY: ${{ steps.filter.outputs.gateway }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FILTER_PROJECTADMIN: ${{ steps.filter.outputs.projectadmin }}
          FILTER_USERADMIN: ${{ steps.filter.outputs.useradmin }}
          FILTER_KEYCLOAK: ${{ steps.filter.outputs.keycloak }}
          FILTER_BRIDGE_DESKTOP: ${{ steps.filter.outputs.bridge-desktop }}
          TARGET_INPUT: ${{ github.event.inputs.target || '' }}
        run: |
          set -euo pipefail

          SERVICES='[
            {"key":"pycaret-engine","image":"pycaret-engine","dockerfile":"./src/ai/ai-service-pycaret-engine/Dockerfile","context":"./src/ai/ai-service-pycaret-engine","app":"pycaret-engine","port":8002,"ingress":"internal"},
            {"key":"identity-api","image":"identity-api","dockerfile":"./src/services/Grafirio.Identity.Api/Grafirio.Identity.Api/Dockerfile","context":".","app":"identity-api","port":8080,"ingress":"internal"},
            {"key":"commerce-api","image":"commerce-api","dockerfile":"./src/services/Grafirio.Commerce.Api/Dockerfile","context":".","app":"commerce-api","port":8080,"ingress":"internal"},
            {"key":"data-analysis-api","image":"data-analysis-api","dockerfile":"./src/services/Grafirio.DataAnalysis.Api/Dockerfile","context":".","app":"data-analysis-api","port":8080,"ingress":"internal"},
            {"key":"gateway","image":"gateway","dockerfile":"./src/services/Grafirio.Gateway/Dockerfile","context":".","app":"gateway","port":8080,"ingress":"external"},
            {"key":"frontend","image":"frontend","dockerfile":"./src/front/grifirio.front/Dockerfile","context":"./src/front","app":"frontend","port":80,"ingress":"external"},
            {"key":"projectadmin","image":"projectadmin","dockerfile":"./src/front/admins/grifirio.projectadmin/Dockerfile","context":"./src/front/admins/grifirio.projectadmin","app":"projectadmin","port":80,"ingress":"external"},
            {"key":"useradmin","image":"useradmin","dockerfile":"./src/front/admins/grifirio.useradmin/Dockerfile","context":"./src/front","app":"useradmin","port":80,"ingress":"external"},
            {"key":"keycloak","image":"keycloak","dockerfile":"./keycloak/Dockerfile","context":".","app":"keycloak","port":8080,"ingress":"external"}
          ]'

          include_all=false
          selected_service=""
          target="${TARGET_INPUT:-changed}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$target" = "all" ]; then
              include_all=true
            elif [ "$target" != "changed" ] && [ -n "$target" ]; then
              selected_service="$target"
            fi
          fi

          changed_keys=""
          for key in pycaret-engine identity-api commerce-api data-analysis-api gateway frontend projectadmin useradmin keycloak; do
            env_key="FILTER_$(echo "$key" | tr '[:lower:]-' '[:upper:]_')"
            value="${!env_key:-false}"
            if [ "$value" = "true" ]; then
              changed_keys="$changed_keys $key"
            fi
          done

          if [ "$include_all" = true ]; then
            matrix="$SERVICES"
          elif [ -n "$selected_service" ]; then
            matrix=$(echo "$SERVICES" | jq -c --arg key "$selected_service" '[.[] | select(.key == $key)]')
          else
            if [ -n "$changed_keys" ]; then
              keys_json=$(printf '%s\n' $changed_keys | jq -R . | jq -sc .)
              matrix=$(echo "$SERVICES" | jq -c --argjson keys "$keys_json" '[.[] | select(.key as $k | ($keys | index($k)) != null)]')
            else
              matrix='[]'
            fi
          fi

          count=$(echo "$matrix" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          # Masaustu kabugu container matrisinin disinda: ayri bir isten
          # (publish-desktop) tetikleniyor, kendi kosulunu burada belirliyoruz.
          if [ "$include_all" = true ] || [ "$selected_service" = "bridge-desktop" ]; then
            echo "bridge_desktop_changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$selected_service" ] && [ "${FILTER_BRIDGE_DESKTOP:-false}" = "true" ]; then
            echo "bridge_desktop_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "bridge_desktop_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Print selected services
        run: |
          echo "Has changes: ${{ steps.generate-matrix.outputs.has_changes }}"
          echo "Matrix: ${{ steps.generate-matrix.outputs.matrix }}"

  build-push-deploy:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name "$ACR_NAME"

      - name: Build, Push, and Deploy Service
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          full_image="$ACR_LOGIN_SERVER/${{ matrix.service.image }}:$TAG"

          echo "Building $full_image"
          # .NET imajlari paylasilan paketleri artik kaynagindan derliyor
          # (bkz. ilgili Dockerfile'lar), bu yuzden derlemenin hicbir pakete
          # ozel kimlik bilgisine ihtiyaci yok.
          #
          # Hangi surumun derlenecegi shared-packages.ref'te yaziyor ve buradan
          # geciriliyor. Dockerfile'daki varsayilan "main" DEGIL: dal takip
          # etmek, servislerin farkli zamanlarda derlenip birbirinden
          # ayrismasina yol aciyordu. Ref .NET disi imajlarda kullanilmiyor;
          # bilinmeyen build-arg zararsiz ve tek bir build komutu tutmak
          # matrisi basit tutuyor.
          shared_ref="$(tr -d '[:space:]' < shared-packages.ref)"
          echo "Paylasilan paket ref: $shared_ref"

          docker build -t "$full_image" \
            --build-arg "SHARED_PACKAGES_REF=$shared_ref" \
            -f "${{ matrix.service.dockerfile }}" "${{ matrix.service.context }}"

          echo "Pushing $full_image"
          docker push "$full_image"

          echo "Deploying container app ${{ matrix.service.app }}"
          if az containerapp show --name "${{ matrix.service.app }}" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
            az containerapp update \
              --name "${{ matrix.service.app }}" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$full_image"
          else
            echo "App not found, creating ${{ matrix.service.app }}"
            ENV_ID=$(az containerapp show --name identity-api --resource-group "$RESOURCE_GROUP" --query "properties.environmentId" -o tsv)
            az containerapp create \
              --name "${{ matrix.service.app }}" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ENV_ID" \
              --image "$full_image" \
              --registry-server "$ACR_LOGIN_SERVER" \
              --target-port "${{ matrix.service.port }}" \
              --ingress "${{ matrix.service.ingress }}"
          fi

      - name: Show updated service status
        run: |
          az containerapp show \
            --name "${{ matrix.service.app }}" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name,state:properties.runningStatus,latestRevision:properties.latestRevisionName}" \
            -o table

  # Masaustu kabugu (Grafirio Bridge Desktop): container servislerinden ayri
  # tutuluyor cunku WPF derlemesi Windows istiyor ve hedefi bir Container App
  # degil, musterinin indirdigi tek bir exe.
  #
  # Depo public-read: dosya gizli degil, bir bridge'i sirkete baglayan sey
  # dosya degil device flow'daki/girisdeki onay (bkz. BridgeInstaller.cs).
  # SAS linki ekstra kod getirirdi, kazandirdigi bir sey olmazdi.
  #
  # Iki kopya yukleniyor: sabit adres panelin kullandigi ("guncel surum
  # buradan inilir"), surumlu kopya ise geri donmek icin — sabit adresin
  # uzerine her seferinde yazilmasi eskiyi kurtarilamaz yapardi.
  publish-desktop:
    runs-on: windows-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.bridge_desktop_changed == 'true'
    timeout-minutes: 30
    env:
      STORAGE_ACCOUNT: grifirioinstallers
      CONTAINER_NAME: installers
      EXE_NAME: GrafirioSetup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - name: Build offline installer
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.BRIDGE_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.BRIDGE_SIGNING_CERTIFICATE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'grafirio-signing.pfx'
          $importedCertificates = @()
          try {
            # Keep the compiler job-local; no machine-wide tools are installed.
            $compilerDirectory = Join-Path $env:RUNNER_TEMP 'grafirio-inno'
            $compilerPackage = Join-Path $env:RUNNER_TEMP 'grafirio-inno.zip'
            Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.3/tools.innosetup.6.7.3.nupkg' -OutFile $compilerPackage
            Expand-Archive -LiteralPath $compilerPackage -DestinationPath $compilerDirectory -Force
            ./src/bridge/installer/tests/Test-Installer.ps1
            $parameters = @{
              Version = "1.0.$env:BUILD_NUMBER"
              OutputDirectory = (Join-Path $env:GITHUB_WORKSPACE 'artifacts/bridge-installer')
              IsccPath = (Join-Path $compilerDirectory 'tools/ISCC.exe')
            }
            # Signing is opt-in: only a supplied production certificate is used.
            if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
              [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
              $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
              $importedCertificates = @(Import-PfxCertificate -FilePath $certificatePath -Password $password -CertStoreLocation Cert:\CurrentUser\My)
              $signingCertificate = $importedCertificates | Where-Object HasPrivateKey | Select-Object -First 1
              if (-not $signingCertificate) { throw 'The supplied PFX has no private key.' }
              $parameters.SigningCertificateThumbprint = $signingCertificate.Thumbprint
            }
            ./src/bridge/installer/Build-Installer.ps1 @parameters
          }
          finally {
            if (Test-Path $certificatePath) { Remove-Item $certificatePath -Force }
            foreach ($certificate in $importedCertificates) {
              Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force
            }
          }

      - name: Retain setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrafirioSetup-${{ github.sha }}
          path: artifacts/bridge-installer/GrafirioSetup.exe
          if-no-files-found: error

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure storage account and container exist
        shell: bash
        run: |
          set -euo pipefail

          if ! az storage account show --name "$STORAGE_ACCOUNT" \
              --resource-group "$RESOURCE_GROUP" &>/dev/null; then
            echo "Storage account yok, oluşturuluyor: $STORAGE_ACCOUNT"

            # Olusturma asenkron ve CLI'nin yoklamasi, hesap hazir olmadan
            # "StorageAccountOperationInProgress" ile dusebiliyor — hesap
            # gercekte olusmus oluyor. Ilk koşumda tam olarak bu yasandi.
            # Komutun raporlamasina degil, asagidaki durum kontrolune
            # guveniyoruz.
            az storage account create \
              --name "$STORAGE_ACCOUNT" \
              --resource-group "$RESOURCE_GROUP" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --allow-blob-public-access true \
              || echo "Oluşturma komutu hata bildirdi; gerçek durum aşağıda doğrulanacak."
          fi

          # Hesap gercekten kullanilabilir olana kadar bekle. Bu adim olmadan
          # bir sonraki komut (anahtar okuma / container acma) yari hazir bir
          # hesaba carpiyor.
          state=""
          for _ in $(seq 1 30); do
            state=$(az storage account show \
              --name "$STORAGE_ACCOUNT" \
              --resource-group "$RESOURCE_GROUP" \
              --query provisioningState -o tsv 2>/dev/null || echo "")

            if [ "$state" = "Succeeded" ]; then
              echo "Storage account hazır."
              break
            fi

            echo "provisioningState=${state:-bilinmiyor}, bekleniyor…"
            sleep 10
          done

          if [ "$state" != "Succeeded" ]; then
            echo "Storage account hazır duruma gelmedi (son durum: ${state:-bilinmiyor})."
            exit 1
          fi

      - name: Upload installer
        shell: bash
        env:
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Veri duzlemi (container/blob islemleri) icin hesap anahtari
          # kullaniliyor, --auth-mode login degil: ikincisi SP'ye ayrica
          # "Storage Blob Data Contributor" rolu atanmasini isterdi ve bu
          # atamanin yapildigindan emin degiliz. Anahtari okumak ise ARM
          # islemi — ayni SP zaten containerapp create/update yapabildigine
          # gore Resource Group'ta Contributor, dolayisiyla bunu da yapabilir.
          # Yeni olusmus bir hesapta anahtar okuma da gecici olarak
          # dusebiliyor; birkac kez deneniyor.
          ACCOUNT_KEY=""
          for _ in $(seq 1 6); do
            ACCOUNT_KEY=$(az storage account keys list \
              --account-name "$STORAGE_ACCOUNT" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[0].value" -o tsv 2>/dev/null || echo "")

            [ -n "$ACCOUNT_KEY" ] && break
            echo "Hesap anahtarı okunamadı, yeniden denenecek…"
            sleep 10
          done

          if [ -z "$ACCOUNT_KEY" ]; then
            echo "Hesap anahtarı okunamadı."
            exit 1
          fi

          az storage container create \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --name "$CONTAINER_NAME" \
            --public-access blob

          # Sabit adres: panelin BridgeInstaller__Url'i hep buraya bakiyor.
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --container-name "$CONTAINER_NAME" \
            --name "$EXE_NAME" \
            --file "artifacts/bridge-installer/$EXE_NAME" \
            --content-type application/octet-stream \
            --content-disposition "attachment; filename=$EXE_NAME" \
            --content-cache-control no-cache \
            --overwrite

          # Surumlu kopya: sabit adres bir sonraki push'ta ustune yazilinca
          # bu surume geri donulebilsin diye.
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --container-name "$CONTAINER_NAME" \
            --name "$VERSION/$EXE_NAME" \
            --file "artifacts/bridge-installer/$EXE_NAME" \
            --content-type application/octet-stream \
            --content-disposition "attachment; filename=$EXE_NAME" \
            --overwrite

          echo "İndirme adresi: https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER_NAME/$EXE_NAME"

      - name: Point download endpoint to the published setup
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name data-analysis-api \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars "BridgeInstaller__Url=https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER_NAME/$EXE_NAME"

  no-op:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes != 'true' && needs.detect-changes.outputs.bridge_desktop_changed != 'true'
    steps:
      - name: No service changes detected
        run: echo "No service-level changes detected. Skipping deployment."
