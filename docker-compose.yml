services:
  mongo.db.identity:
    restart: always
    image: mongo:8.0-rc
    container_name: mongo.db.identity.container
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo.db.identity.volume:/data/db
    networks:
      - grifirio_network
  mongo.db.catalog:
    restart: always
    image: mongo:8.0-rc
    container_name: mongo.db.catalog.container
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27030:27017"
    volumes:
      - mongo.db.catalog.volume:/data/db
    networks:
      - grifirio_network
  mongo.db.catalog.ui:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo.db.catalog.ui.container
    ports:
      - 27032:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo.db.catalog:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo.db.catalog
    networks:
      - grifirio_network
  redis.db.basket:
    restart: always
    image: redis:7.0-alpine
    container_name: redis.db.container
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis.db.basket.volume:/data
    networks:
      - grifirio_network
  redis.db.basket.ui:
    restart: always
    image: rediscommander/redis-commander:latest
    container_name: redis.db.basket.ui.container
    ports:
      - "27033:8081"
    environment:
      REDIS_HOST: redis.db.basket
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HTTP_USER: ${REDIS_UI_USERNAME}
      HTTP_PASSWORD: ${REDIS_UI_PASSWORD}
    depends_on:
      - redis.db.basket
    networks:
      - grifirio_network
  mongo.db.discount:
    restart: always
    image: mongo:8.0-rc
    container_name: mongo.db.discount.container
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27034:27017"
    volumes:
      - mongo.db.discount.volume:/data/db
    networks:
      - grifirio_network
  mongo.db.discount.ui:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo.db.discount.ui.container
    ports:
      - 27036:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo.db.discount:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo.db.discount
    networks:
      - grifirio_network
  sqlserver.db.order:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver.db.order
    user: root
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver.db.order.volume:/var/opt/mssql
    networks:
      - grifirio_network
  keycloak:
    restart: always
    container_name: keycloak
    image: quay.io/keycloak/keycloak:25.0
    command: start
    environment:
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HOSTNAME_STRICT: false
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres.db.keycloak/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      # Grifirio custom theme mount
      - ./docker-keycloak-themes:/opt/keycloak/themes
    depends_on:
      - postgres.db.keycloak
    networks:
      - grifirio_network
  postgres.db.keycloak:
    restart: always
    image: postgres:16.2
    container_name: postgres.db.keycloak.container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - posrgres.db.keycloak.volume:/var/lib/postgresql/data
    networks:
      - grifirio_network
  postgres.db.keycloak.ui:
    restart: always
    image: dpage/pgadmin4
    container_name: postgres.db.keycloak.container.ui
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    volumes:
      - posrgres.db.keycloak.ui.volume:/var/lib/pgadmin
    depends_on:
      - postgres.db.keycloak
    networks:
      - grifirio_network
  postgres.db.dataanalysis:
    restart: always
    image: postgres:16.2
    container_name: postgres.db.dataanalysis.container
    environment:
      POSTGRES_DB: grafirio_dataanalysis
      POSTGRES_USER: dataanalysis_user
      POSTGRES_PASSWORD: DataAnalysis123!
    ports:
      - "5433:5432"
    volumes:
      - postgres.db.dataanalysis.volume:/var/lib/postgresql/data
    networks:
      - grifirio_network
  rabbitmq:
    restart: always
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq.container
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq.volume:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - grifirio_network
  django.ai:
    build:
      context: ./src/ai/grafirio-ai-service
      dockerfile: Dockerfile
    container_name: django.ai.container
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: django-ai,localhost
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CELERY_RESULT_BACKEND: redis://redis.db.basket:6379/1
      REDIS_HOST: redis.db.basket
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AI_SERVICE_1_URL: ${AI_SERVICE_1_URL}
      AI_SERVICE_2_URL: ${AI_SERVICE_2_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CSHARP_API_URL: http://host.docker.internal:5221
      MSSQL_HOST: sqlserver.db.order
      MSSQL_PORT: 1433
      MSSQL_DB: GrafirioECommerce
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${SA_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
      - redis.db.basket
    networks:
      - grifirio_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py start_ai_consumer &
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
  celery.worker:
    build:
      context: ./src/ai/grafirio-ai-service
      dockerfile: Dockerfile
    container_name: celery.worker.container
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CELERY_RESULT_BACKEND: redis://redis.db.basket:6379/1
      REDIS_HOST: redis.db.basket
      REDIS_PORT: 6379
      AI_SERVICE_1_URL: ${AI_SERVICE_1_URL}
      AI_SERVICE_2_URL: ${AI_SERVICE_2_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MSSQL_HOST: sqlserver.db.order
      MSSQL_PORT: 1433
      MSSQL_DB: GrafirioECommerce
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${SA_PASSWORD}
    depends_on:
      - rabbitmq
      - redis.db.basket
    networks:
      - grifirio_network
    command: celery -A config worker --loglevel=info
  schema.analyzer:
    build:
      context: ./src/ai/ai-service-schema-analyzer
      dockerfile: Dockerfile
    container_name: schema.analyzer.container
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RABBITMQ_HOST: rabbitmq.container
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest123
      BACKEND_API_URL: http://data-analysis.api.container:5221
      SA_PASSWORD: ${SA_PASSWORD}
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    volumes:
      - ./src/ai/ai-service-schema-analyzer:/app
    depends_on:
      - rabbitmq
      - data-analysis.api
    networks:
      - grifirio_network
  pycaret.engine:
    build:
      context: ./src/ai/ai-service-pycaret-engine
      dockerfile: Dockerfile
    container_name: pycaret.engine.container
    environment:
      LOG_LEVEL: INFO
      MODEL_STORAGE_PATH: /app/models
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest123
    ports:
      - "8002:8002"
    volumes:
      - ./src/ai/ai-service-pycaret-engine:/app
      - pycaret.models.volume:/app/models
    depends_on:
      - rabbitmq
    networks:
      - grifirio_network
  # .NET Microservices
  identity.api:
    build:
      context: .
      dockerfile: src/services/Grafirio.Identity.Api/Grafirio.Identity.Api/Dockerfile
    container_name: identity.api.container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5036
    ports:
      - "5036:5036"
    depends_on:
      - postgres.db.keycloak
      - rabbitmq
    networks:
      - grifirio_network
  catalog.api:
    build:
      context: .
      dockerfile: src/services/Grafirio.Catalog.Api/Dockerfile
    container_name: catalog.api.container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5280
    ports:
      - "5280:5280"
    depends_on:
      - mongo.db.catalog
      - rabbitmq
    networks:
      - grifirio_network
  basket.api:
    build:
      context: .
      dockerfile: src/services/Grafirio.Basket.Api/Dockerfile
    container_name: basket.api.container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5023
    ports:
      - "5023:5023"
    depends_on:
      - redis.db.basket
      - rabbitmq
    networks:
      - grifirio_network
  data-analysis.api:
    build:
      context: .
      dockerfile: src/services/Grafirio.DataAnalysis.Api/Dockerfile
    container_name: data-analysis.api.container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5221
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PyCaret__BaseUrl: http://pycaret.engine.container:8002
      RabbitMQ__Host: rabbitmq.container
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      REDIS__CONNECTIONSTRING: redis.db.basket:6379,password=${REDIS_PASSWORD},abortConnect=false
    ports:
      - "5221:5221"
    depends_on:
      - postgres.db.dataanalysis
      - rabbitmq
      - redis.db.basket
    networks:
      - grifirio_network
  gateway:
    build:
      context: .
      dockerfile: src/services/Grafirio.Gateway/Dockerfile
    container_name: gateway.container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
    ports:
      - "5000:5000"
    depends_on:
      - identity.api
      - catalog.api
      - basket.api
      - data-analysis.api
    networks:
      - grifirio_network
  frontend:
    build:
      context: ./src/front/grifirio.front
      dockerfile: Dockerfile
    container_name: frontend.container
    environment:
      NODE_ENV: development
      VITE_API_URL: http://gateway:5000
    ports:
      - "59264:59264"
    depends_on:
      - gateway
    networks:
      - grifirio_network
  service.manager.api:
    build:
      context: ./src/front/admins/grifirio.projectadmin/api
      dockerfile: Dockerfile
    container_name: service.manager.api.container
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - grifirio_network
  projectadmin:
    build:
      context: ./src/front/admins/grifirio.projectadmin
      dockerfile: Dockerfile
    container_name: projectadmin.container
    environment:
      NODE_ENV: development
      VITE_API_URL: http://gateway:5000
      VITE_SERVICE_MANAGER_API: http://service.manager.api:3001
    ports:
      - "59265:59265"
    depends_on:
      - gateway
      - service.manager.api
    networks:
      - grifirio_network
  useradmin:
    build:
      context: ./src/front/admins/grifirio.useradmin
      dockerfile: Dockerfile
    container_name: useradmin.container
    environment:
      NODE_ENV: development
      VITE_API_URL: http://gateway:5000
    ports:
      - "59266:59266"
    depends_on:
      - gateway
    networks:
      - grifirio_network
networks:
  grifirio_network:
    driver: bridge
volumes:
  mongo.db.identity.volume:
  mongo.db.catalog.volume:
  redis.db.basket.volume:
  mongo.db.discount.volume:
  sqlserver.db.order.volume:
  posrgres.db.keycloak.volume:
  posrgres.db.keycloak.ui.volume:
  postgres.db.dataanalysis.volume:
  rabbitmq.volume:
  pycaret.models.volume:
 
