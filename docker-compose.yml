services:
  mongo.db:
    restart: always
    image: mongo:8.0-rc
    container_name: mongo.db.container
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo.db.volume:/data/db
    networks:
      - grifirio_network
  mongo.db.ui:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo.db.ui.container
    ports:
      - "27032:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo.db:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo.db
    networks:
      - grifirio_network
  redis.db.basket:
    restart: always
    image: redis:7.0-alpine
    container_name: redis.db.container
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis.db.basket.volume:/data
    networks:
      - grifirio_network
  redis.db.basket.ui:
    restart: always
    image: rediscommander/redis-commander:latest
    container_name: redis.db.basket.ui.container
    ports:
      - "27033:8081"
    environment:
      REDIS_HOST: redis.db.basket
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      HTTP_USER: ${REDIS_UI_USERNAME}
      HTTP_PASSWORD: ${REDIS_UI_PASSWORD}
    depends_on:
      - redis.db.basket
    networks:
      - grifirio_network
  sqlserver.db.order:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver.db.order
    user: root
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver.db.order.volume:/var/opt/mssql
    networks:
      - grifirio_network
  keycloak:
    restart: always
    container_name: keycloak
    image: quay.io/keycloak/keycloak:25.0
    command: start --import-realm
    environment:
      # Token'daki `iss` her istekte, isteğin geldiği host'a göre üretiliyordu:
      # konteyner içinden `keycloak:8080`, tarayıcıdan ve yığının dışında
      # çalışan bir bridge'den `localhost:8080`. Aynı realm iki farklı kimlik
      # gösteriyordu, servislerin doğruladığı yalnızca biriydi ve dışarıdan
      # alınan token 401 dönüyordu. Bridge müşterinin ağında çalıştığı için
      # bu yolu HER ZAMAN dışarıdan yürüyor.
      #
      # Burada sabitlenen şey yalnızca dışarıya görünen adres — yani `iss`.
      KC_HOSTNAME: http://localhost:8080
      # Arka kanal buna dahil değil: JWKS ve token uçları isteğin geldiği
      # host'tan üretilmeye devam ediyor, böylece konteyner içindeki servisler
      # Keycloak'a servis adıyla ulaşabiliyor. Bu satır olmadan keşif belgesi
      # konteynerlere `localhost:8080` adresini verir ve hiçbiri anahtarları
      # çekemez.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres.db.keycloak/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      # Grifirio custom theme mount
      - ./docker-keycloak-themes:/opt/keycloak/themes
      # grafirio realm is re-imported on every start, so an empty DB self-heals
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      - postgres.db.keycloak
    networks:
      - grifirio_network
  postgres.db.keycloak:
    restart: always
    image: postgres:16.2
    container_name: postgres.db.keycloak.container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - posrgres.db.keycloak.volume:/var/lib/postgresql/data
    networks:
      - grifirio_network
  postgres.db.keycloak.ui:
    restart: always
    image: dpage/pgadmin4
    container_name: postgres.db.keycloak.container.ui
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user-name@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: strong-password
    volumes:
      - posrgres.db.keycloak.ui.volume:/var/lib/pgadmin
    depends_on:
      - postgres.db.keycloak
    networks:
      - grifirio_network
  postgres.db.dataanalysis:
    restart: always
    image: postgres:16.2
    container_name: postgres.db.dataanalysis.container
    environment:
      POSTGRES_DB: grafirio_dataanalysis
      POSTGRES_USER: dataanalysis_user
      POSTGRES_PASSWORD: DataAnalysis123!
    ports:
      - "5433:5432"
    volumes:
      - postgres.db.dataanalysis.volume:/var/lib/postgresql/data
    networks:
      - grifirio_network
  rabbitmq:
    restart: always
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq.container
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq.volume:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - grifirio_network
  pycaret.engine:
    build:
      context: ./src/ai/ai-service-pycaret-engine
      dockerfile: Dockerfile
    container_name: pycaret.engine.container
    environment:
      LOG_LEVEL: INFO
      MODEL_STORAGE_PATH: /app/models
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
      # Veri artik bu servise kimlik bilgisiyle gelmiyor: sorgu
      # DataAnalysis.Api'nin ic ucuna gonderiliyor, satirlar oradan aliniyor.
      DATA_ANALYSIS_API_URL: http://data-analysis.api.container:5221
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "8002:8002"
    volumes:
      - ./src/ai/ai-service-pycaret-engine:/app
      - pycaret.models.volume:/app/models
    depends_on:
      - rabbitmq
    networks:
      - grifirio_network
  # .NET Microservices
  identity.api:
    build:
      context: .
      dockerfile: src/services/Grafirio.Identity.Api/Grafirio.Identity.Api/Dockerfile
    container_name: identity.api.container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5036
      MongoOption__ConnectionString: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo.db:27017
      MongoOption__DatabaseName: GrafirioIdentityDb
      # Adres ile issuer AYRI: adres Keycloak'a nasıl ulaşıldığı (konteyner
      # ağı), issuer ise token'da ne yazdığı (dışarıya görünen adres). İkisini
      # eşitlemek, yığının dışından alınan her token'ı reddetmek demekti.
      IdentityOption__Address: http://keycloak:8080
      IdentityOption__Issuer: http://localhost:8080/realms/grafirio
      IdentityOption__Audience: grafirio-api
      KeycloakAdmin__Realm: grafirio
      KeycloakAdmin__Username: ${KEYCLOAK_ADMIN}
      KeycloakAdmin__Password: ${KEYCLOAK_ADMIN_PASSWORD}
      # Identity olay yayinliyor (sirket kuruldu, uyelik degisti) ama kuyruk
      # kimligi buraya hic verilmemisti: appsettings.json bos parola tasiyor,
      # dolayisiyla yigin ayakta olsa bile baglanti ACCESS_REFUSED ile
      # reddediliyordu. data-analysis.api ayni degiskenleri zaten aliyor.
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "5036:5036"
    depends_on:
      - mongo.db
      - keycloak
    networks:
      - grifirio_network
  commerce.api:
    build:
      context: .
      dockerfile: src/services/Grafirio.Commerce.Api/Dockerfile
    container_name: commerce.api.container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5300
      MongoOption__ConnectionString: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo.db:27017
      CatalogMongoOption__DatabaseName: catalog-db
      DiscountMongoOption__DatabaseName: discount-db
      ConnectionStrings__Redis: redis.db.basket:6379,password=${REDIS_PASSWORD},abortConnect=false
      ConnectionStrings__SqlServer: Server=sqlserver.db.order,1433;Database=GrafirioECommerce;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      IdentityOption__Address: http://keycloak:8080/realms/grafirio
      IdentityOption__Issuer: http://localhost:8080/realms/grafirio
      IdentityOption__Audience: commerce.api
    ports:
      - "5300:5300"
    depends_on:
      - mongo.db
      - redis.db.basket
      - sqlserver.db.order
      - keycloak
    networks:
      - grifirio_network
  data-analysis.api:
    build:
      context: .
      dockerfile: src/services/Grafirio.DataAnalysis.Api/Dockerfile
    container_name: data-analysis.api.container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5221
      # appsettings.Development.json'daki dize localhost:5433'u gosteriyor —
      # servisi Docker DISINDA calistiranlar icin dogru, konteyner icinde
      # degil. Ortam Development oldugu icin o dosya appsettings.json'i
      # eziyordu ve konteyner kendi icindeki 127.0.0.1'e baglanmaya
      # calisiyordu. Compose kendi degerini acikca vermeli.
      ConnectionStrings__DefaultConnection: Host=postgres.db.dataanalysis;Port=5432;Database=grafirio_dataanalysis;Username=dataanalysis_user;Password=DataAnalysis123!
      # LLM: tek saglayici Azure OpenAI. Onceden burada yalnizca
      # GEMINI_API_KEY vardi; Azure degiskenleri hic gecmedigi icin
      # container icindeki servis LLM'siz ayaga kalkiyordu.
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      # Tablo secimi Mongo'da; bu da eksikti.
      # Kimlik bilgisi dizeye GOMULMUYOR: sifre '@' ya da '/' iceriyorsa URI
      # gecersiz oluyor ve hata "sifre yanlis" degil "dize gecersiz" diyor.
      # Ayri alanlar verilince kacis isini surucu yapiyor.
      MONGO__CONNECTIONSTRING: mongodb://mongo.db:27017/?authSource=admin
      MONGO__USERNAME: ${MONGO_USERNAME}
      MONGO__PASSWORD: ${MONGO_PASSWORD}
      MONGO__DATABASENAME: GrafirioDataAnalysisDb
      # "Analiz Et" isi kuyruga aliniyor: profil + LLM cagrisi dakikalar
      # suruyor ve container yeniden baslasa bile is kaybolmamali.
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      PyCaret__BaseUrl: http://pycaret.engine.container:8002
      # PyCaret'in veri okudugu ic ucun anahtari. Tanimsizsa uc kapalidir:
      # ic aga erisen herkese musteri veritabaninda sorgu calistirma yetkisi
      # vermek yerine hicbir seyin calismamasi tercih ediliyor.
      Internal__ApiKey: ${INTERNAL_API_KEY}
      # Musteri veritabani sifrelerini koruyan anahtar. Compose'da hic
      # gecmiyordu; EncryptionHelper.EnsureConfigured() bunu zorunlu tuttugu
      # icin servis acilista duruyordu.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
      # Token dogrulama. appsettings.json'daki adres uretimdeki Keycloak'i
      # (login.grafirio.com) gosteriyor ve Development dosyasinda karsiligi
      # yok — compose kendi degerini acikca vermezse konteyner icindeki servis
      # yerel yigindaki Keycloak yerine uretimi sorguluyor.
      IdentityOption__Address: http://keycloak:8080/realms/grafirio
      IdentityOption__Issuer: http://localhost:8080/realms/grafirio
      IdentityOption__Audience: gateway.api
      # Yetki sorusu Identity'ye dogrudan gidiyor, gateway uzerinden degil:
      # soru ic agda kaliyor ve gateway'in kendi kimlik dogrulamasi araya
      # bir katman daha koyardi.
      PermissionOption__IdentityAddress: http://identity.api.container:5036
      # Bridge kimlikleri Keycloak'ta acilip kapatiliyor: her bridge bir
      # client. Adres burada realm'siz — yonetim ucu /admin/realms/... altinda.
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: grafirio
      # Yerel gelistirme icin yonetici kullanicisi. Uretimde bunun yerine
      # realm uzerinde yalnizca manage-clients yetkisi olan bir servis hesabi
      # verilmeli: Keycloak__AdminClientId / Keycloak__AdminClientSecret.
      Keycloak__AdminUsername: ${KEYCLOAK_ADMIN}
      Keycloak__AdminPassword: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "5221:5221"
    depends_on:
      - postgres.db.dataanalysis
      - mongo.db
      - rabbitmq
      - keycloak
    networks:
      - grifirio_network
  gateway:
    build:
      context: .
      dockerfile: src/services/Grafirio.Gateway/Dockerfile
    container_name: gateway.container
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ReverseProxy__Clusters__commerce.cluster__Destinations__destination1__Address: http://commerce.api.container:5300
      ReverseProxy__Clusters__identity.cluster__Destinations__destination1__Address: http://identity.api.container:5036
      ReverseProxy__Clusters__data-analysis.cluster__Destinations__destination1__Address: http://data-analysis.api.container:5221
      # appsettings.Development.json localhost:8080 diyor — gateway'i Docker
      # DISINDA calistiranlar icin dogru, konteyner icinde degil: orada
      # localhost gateway'in kendisi. Keycloak'a servis adiyla gidilmeli.
      IdentityOption__Address: http://keycloak:8080/realms/grafirio
      IdentityOption__Issuer: http://localhost:8080/realms/grafirio
      IdentityOption__Audience: gateway.api
    ports:
      - "5000:5000"
    depends_on:
      - identity.api
      - commerce.api
      - data-analysis.api
      - keycloak
    networks:
      - grifirio_network
  frontend:
    build:
      context: ./src/front/grifirio.front
      dockerfile: Dockerfile
    container_name: frontend.container
    environment:
      NODE_ENV: development
      VITE_API_URL: http://gateway:5000
    ports:
      - "59264:59264"
    depends_on:
      - gateway
    networks:
      - grifirio_network
  service.manager.api:
    build:
      context: ./src/front/admins/grifirio.projectadmin/api
      dockerfile: Dockerfile
    container_name: service.manager.api.container
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - grifirio_network
  projectadmin:
    build:
      context: ./src/front/admins/grifirio.projectadmin
      dockerfile: Dockerfile
    container_name: projectadmin.container
    environment:
      NODE_ENV: development
      VITE_API_URL: http://gateway:5000
      VITE_SERVICE_MANAGER_API: http://service.manager.api:3001
    ports:
      - "59265:59265"
    depends_on:
      - gateway
      - service.manager.api
    networks:
      - grifirio_network
  useradmin:
    build:
      context: ./src/front/admins/grifirio.useradmin
      dockerfile: Dockerfile
    container_name: useradmin.container
    environment:
      NODE_ENV: development
      VITE_API_URL: http://gateway:5000
    ports:
      - "59266:59266"
    depends_on:
      - gateway
    networks:
      - grifirio_network
networks:
  grifirio_network:
    driver: bridge
volumes:
  mongo.db.volume:
  redis.db.basket.volume:
  sqlserver.db.order.volume:
  posrgres.db.keycloak.volume:
  posrgres.db.keycloak.ui.volume:
  postgres.db.dataanalysis.volume:
  rabbitmq.volume:
  pycaret.models.volume:
 
