# Grafirio metrik sozlugu (semantic layer)
# LLM her seferinde formul icat etmesin diye is metrikleri TEK yerde tanimlanir.
# SQL uretim prompt'una enjekte edilir: "metrik eslesirse sql_expression'i AYNEN kullan".
# Sema: GrafirioECommerce (T-SQL)

- name: gelir
  aliases: [revenue, ciro, toplam gelir, satis geliri, kazanc]
  description: Toplam satis geliri (siparis toplamlari)
  sql_expression: "SUM(o.TotalAmount)"
  required_joins: "Orders o"
  grain: monthly

- name: karlilik
  aliases: [kar, net kar, profit, karlılık]
  description: Satis geliri eksi urun maliyeti
  sql_expression: "SUM(oi.TotalPrice) - SUM(oi.Quantity * p.CostPrice)"
  required_joins: "OrderItems oi JOIN Products p ON p.Id = oi.ProductId JOIN Orders o ON o.Id = oi.OrderId"
  grain: monthly

- name: maliyet
  aliases: [cost, toplam maliyet, urun maliyeti, gider]
  description: Satilan urunlerin toplam maliyeti
  sql_expression: "SUM(oi.Quantity * p.CostPrice)"
  required_joins: "OrderItems oi JOIN Products p ON p.Id = oi.ProductId JOIN Orders o ON o.Id = oi.OrderId"
  grain: monthly

- name: bilanco_ozeti
  aliases: [bilanco, bilanço, gelir gider tablosu, finansal ozet]
  description: Aylik gelir, maliyet ve net kar birlikte (uc seri)
  sql_expression: "SUM(oi.TotalPrice) AS Gelir, SUM(oi.Quantity * p.CostPrice) AS Maliyet, SUM(oi.TotalPrice) - SUM(oi.Quantity * p.CostPrice) AS NetKar"
  required_joins: "OrderItems oi JOIN Products p ON p.Id = oi.ProductId JOIN Orders o ON o.Id = oi.OrderId"
  grain: monthly

- name: satis_adedi
  aliases: [satis miktari, satilan adet, quantity, satış adedi]
  description: Satilan toplam urun adedi
  sql_expression: "SUM(oi.Quantity)"
  required_joins: "OrderItems oi"
  grain: monthly

- name: ortalama_sepet
  aliases: [sepet ortalamasi, average basket, aov, ortalama siparis tutari]
  description: Siparis basina ortalama tutar
  sql_expression: "AVG(o.TotalAmount)"
  required_joins: "Orders o"
  grain: monthly
